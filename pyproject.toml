[project]
name = "advent-of-code"
version = "0.1.0"
description = "Marimo notebooks solving Advent of Code puzzles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.18.4",
    "pulp>=3.3.0,<4",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "ruff>=0.11.6",
    "ty>=0.0.29",
]

[tool.deptry]
# "aoc" is imported as a first-party package in the current code.
known_first_party = ["aoc"]

[tool.docstring_tailor]
line-length = 80
style = "google"
[tool.ty.src]
exclude = ["**/*.ipynb"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
