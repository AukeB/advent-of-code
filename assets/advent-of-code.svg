<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-label="A cozy winter night with a glowing Christmas tree, a star, a mug of cocoa and falling snow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#3d5a80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky and glow -->
  <rect width="640" height="180" fill="url(#sky)"/>
  <circle cx="320" cy="100" r="150" fill="url(#glow)"/>

  <!-- Falling snow, spread across the full width -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="3" cy="24.6" r="2.2"/>
    <circle cx="20.1" cy="98.3" r="1.4"/>
    <circle cx="45.4" cy="14.4" r="2.2"/>
    <circle cx="65.1" cy="17.5" r="1.8"/>
    <circle cx="84.8" cy="18.0" r="1.8"/>
    <circle cx="106.2" cy="70.2" r="1.4"/>
    <circle cx="134.6" cy="72.1" r="1.4"/>
    <circle cx="155.4" cy="51.6" r="1.4"/>
    <circle cx="170.6" cy="102.4" r="1.8"/>
    <circle cx="196.5" cy="67.5" r="2.2"/>
    <circle cx="216.7" cy="97.8" r="1.4"/>
    <circle cx="235.7" cy="70.8" r="1.4"/>
    <circle cx="260.5" cy="68.3" r="1.4"/>
    <circle cx="284.3" cy="76.1" r="1.8"/>
    <circle cx="307.2" cy="55.0" r="1.8"/>
    <circle cx="326.1" cy="109.6" r="1.8"/>
    <circle cx="345.6" cy="95.4" r="2.2"/>
    <circle cx="372.9" cy="17.0" r="1.8"/>
    <circle cx="391.3" cy="104.3" r="2.2"/>
    <circle cx="411.9" cy="75.0" r="1.4"/>
    <circle cx="429.4" cy="54.0" r="1.8"/>
    <circle cx="451.3" cy="61.8" r="1.4"/>
    <circle cx="482.5" cy="16.5" r="2.2"/>
    <circle cx="499.4" cy="104.3" r="1.8"/>
    <circle cx="518.1" cy="46.5" r="1.8"/>
    <circle cx="542.5" cy="58.2" r="1.4"/>
    <circle cx="568.3" cy="60.2" r="2.2"/>
    <circle cx="579.3" cy="88.4" r="1.8"/>
    <circle cx="607.8" cy="117.2" r="1.8"/>
    <circle cx="624.9" cy="50.4" r="2.2"/>
  </g>

  <!-- Snowy ground: objects below stand on it -->
  <path d="M0 150 Q160 142 320 150 T640 150 L640 180 L0 180 Z" fill="#e8f1f8"/>

  <!-- Tree -->
  <g>
    <rect x="194" y="138" width="12" height="20" rx="2" fill="#7a4e2d"/>
    <polygon points="200,30 222,70 212,70 232,104 220,104 240,138 160,138 180,104 168,104 188,70 178,70" fill="#2d6a4f"/>
    <circle cx="192" cy="88" r="3.5" fill="#e63946"/>
    <circle cx="212" cy="112" r="3.5" fill="#ffd166"/>
    <circle cx="184" cy="124" r="3.5" fill="#e63946"/>
    <circle cx="206" cy="130" r="3.5" fill="#90e0ef"/>
    <circle cx="200" cy="118" r="3" fill="#ffd166"/>
  </g>
  <polygon points="200,14 203.5,22 212,22 205,27.5 207.5,36 200,31 192.5,36 195,27.5 188,22 196.5,22" fill="#ffd166"/>

  <!-- Cocoa mug -->
  <g>
    <rect x="330" y="130" width="24" height="28" rx="4" fill="#f4a261"/>
    <path d="M354 136 q10 0 0 12" fill="none" stroke="#f4a261" stroke-width="3"/>
    <rect x="330" y="134" width="24" height="5" fill="#8d5524"/>
    <path d="M336 124 q-4 -7 0 -12 M343 124 q-4 -7 0 -12" fill="none" stroke="#e8f1f8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Candle -->
  <g>
    <rect x="456" y="124" width="9" height="34" rx="1.5" fill="#fefae0"/>
    <path d="M460.5 110 q-5 9 0 13 q5 -4 0 -13 Z" fill="#ff9f1c"/>
    <path d="M460.5 116 q-2 4 0 6 q2 -2 0 -6 Z" fill="#ffd166"/>
  </g>

  <!-- Small tree -->
  <g>
    <rect x="556" y="146" width="6" height="12" rx="1" fill="#7a4e2d"/>
    <polygon points="559,118 568,134 563,134 572,150 546,150 555,134 550,134" fill="#2d6a4f"/>
    <circle cx="559" cy="112" r="2" fill="#ffd166"/>
  </g>
</svg>
