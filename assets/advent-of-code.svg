<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="A cozy winter night with a glowing Christmas tree, a star, a mug of cocoa and falling snow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#3d5a80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky and glow -->
  <rect width="640" height="260" fill="url(#sky)"/>
  <circle cx="320" cy="120" r="150" fill="url(#glow)"/>

  <!-- Snowy ground -->
  <path d="M0 215 Q160 195 320 212 T640 205 L640 260 L0 260 Z" fill="#e8f1f8"/>

  <!-- Falling snow -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="60" cy="40" r="2.5"/>
    <circle cx="110" cy="90" r="2"/>
    <circle cx="180" cy="30" r="2.5"/>
    <circle cx="230" cy="150" r="2"/>
    <circle cx="420" cy="50" r="2.5"/>
    <circle cx="470" cy="110" r="2"/>
    <circle cx="540" cy="35" r="2.5"/>
    <circle cx="590" cy="150" r="2"/>
    <circle cx="610" cy="75" r="2"/>
  </g>

  <!-- Tree -->
  <g>
    <rect x="308" y="190" width="24" height="26" rx="3" fill="#7a4e2d"/>
    <polygon points="320,40 352,95 336,95 362,140 344,140 374,190 266,190 296,140 278,140 304,95 288,95" fill="#2d6a4f"/>
    <!-- Ornaments -->
    <circle cx="312" cy="112" r="4" fill="#e63946"/>
    <circle cx="334" cy="128" r="4" fill="#ffd166"/>
    <circle cx="296" cy="160" r="4" fill="#e63946"/>
    <circle cx="346" cy="165" r="4" fill="#90e0ef"/>
    <circle cx="320" cy="150" r="3" fill="#ffd166"/>
  </g>

  <!-- Star on top -->
  <polygon points="320,18 325,30 338,30 328,38 332,51 320,43 308,51 312,38 302,30 315,30" fill="#ffd166"/>

  <!-- Cocoa mug -->
  <g>
    <rect x="128" y="168" width="36" height="42" rx="6" fill="#f4a261"/>
    <path d="M164 178 q18 0 0 22" fill="none" stroke="#f4a261" stroke-width="6"/>
    <path d="M136 160 q-6 -10 0 -18 M146 160 q-6 -10 0 -18 M156 160 q-6 -10 0 -18" fill="none" stroke="#e8f1f8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <rect x="128" y="176" width="36" height="8" fill="#8d5524"/>
  </g>

  <!-- Candle -->
  <g>
    <rect x="482" y="170" width="14" height="40" rx="2" fill="#fefae0"/>
    <path d="M489 150 q-7 14 0 20 q7 -6 0 -20 Z" fill="#ff9f1c"/>
    <path d="M489 160 q-3 6 0 9 q3 -3 0 -9 Z" fill="#ffd166"/>
  </g>
</svg>
