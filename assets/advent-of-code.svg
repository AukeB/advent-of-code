<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-label="A cozy winter night with a glowing Christmas tree, a star, a mug of cocoa and falling snow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#3d5a80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky and glow -->
  <rect width="1200" height="180" fill="url(#sky)"/>
  <circle cx="600" cy="90" r="260" fill="url(#glow)"/>

  <!-- Falling snow -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="60" cy="30" r="2"/>
    <circle cx="150" cy="95" r="1.6"/>
    <circle cx="230" cy="20" r="2"/>
    <circle cx="390" cy="60" r="1.6"/>
    <circle cx="430" cy="25" r="2"/>
    <circle cx="700" cy="40" r="2"/>
    <circle cx="790" cy="90" r="1.6"/>
    <circle cx="960" cy="22" r="2"/>
    <circle cx="1010" cy="70" r="1.6"/>
    <circle cx="1110" cy="35" r="2"/>
    <circle cx="1160" cy="100" r="1.6"/>
  </g>

  <!-- Snowy ground -->
  <path d="M0 150 Q300 138 600 150 T1200 146 L1200 180 L0 180 Z" fill="#e8f1f8"/>

  <!-- Large tree -->
  <g>
    <rect x="294" y="128" width="12" height="16" rx="2" fill="#7a4e2d"/>
    <polygon points="300,44 316,70 308,70 322,94 314,94 330,128 270,128 286,94 278,94 292,70 284,70" fill="#2d6a4f"/>
    <circle cx="300" cy="82" r="2.5" fill="#e63946"/>
    <circle cx="312" cy="106" r="2.5" fill="#ffd166"/>
    <circle cx="288" cy="112" r="2.5" fill="#e63946"/>
    <circle cx="304" cy="118" r="2.5" fill="#90e0ef"/>
  </g>
  <polygon points="300,24 303.5,32 312,32 305,37.5 307.5,46 300,41 292.5,46 295,37.5 288,32 296.5,32" fill="#ffd166"/>

  <!-- Cocoa mug -->
  <g>
    <rect x="552" y="116" width="24" height="26" rx="4" fill="#f4a261"/>
    <path d="M576 122 q10 0 0 12" fill="none" stroke="#f4a261" stroke-width="3"/>
    <rect x="552" y="120" width="24" height="5" fill="#8d5524"/>
    <path d="M558 110 q-4 -7 0 -12 M564 110 q-4 -7 0 -12" fill="none" stroke="#e8f1f8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Candle -->
  <g>
    <rect x="852" y="118" width="9" height="24" rx="1.5" fill="#fefae0"/>
    <path d="M856.5 106 q-5 9 0 13 q5 -4 0 -13 Z" fill="#ff9f1c"/>
    <path d="M856.5 112 q-2 4 0 6 q2 -2 0 -6 Z" fill="#ffd166"/>
  </g>

  <!-- Small tree -->
  <g>
    <rect x="1054" y="132" width="6" height="12" rx="1" fill="#7a4e2d"/>
    <polygon points="1057,100 1066,116 1061,116 1070,132 1044,132 1053,116 1048,116" fill="#2d6a4f"/>
    <circle cx="1057" cy="94" r="2" fill="#ffd166"/>
  </g>
</svg>
